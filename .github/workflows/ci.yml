name: Checks

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: checks-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  opencode-retry:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        opencode: ["2.0.30", "latest"]
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: 24
      - name: Install the actual OpenCode runtime
        run: npm install --prefix .build/opencode --no-audit --no-fund "@opencode/cli@${{ matrix.opencode }}" @prevalentware/opencode-goal-plugin@0.1.64
      - name: Verify cyber refusal and ordinary retries against a local fixture
        env:
          OPENCODE_BIN: ${{ github.workspace }}/.build/opencode/node_modules/.bin/opencode
          OPENCODE_GOAL_PACKAGE: ${{ github.workspace }}/.build/opencode/node_modules/@prevalentware/opencode-goal-plugin
        run: npm run opencode:smoke
  android-runtime:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci --ignore-scripts
      - name: Prepare Hermes build dependencies
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends cmake ninja-build g++ libicu-dev
      - uses: actions/cache@v6.1.0
        with:
          path: .build/hermes/
          key: ${{ runner.os }}-${{ runner.arch }}-hermes-${{ hashFiles('package-lock.json', 'scripts/prepare-hermes.mjs') }}
      - name: Build the engine pinned by React Native
        run: npm run hermes:prepare
      - name: Dynamically load the official plugin bundle in Hermes
        run: npm run hermes:smoke
  installed-host:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium firefox
      - name: Install plugin into Paseo and exercise settings in real browsers
        run: npm run browser:smoke
      - uses: actions/upload-artifact@v7.0.2
        if: failure()
        with:
          name: paseo-browser-diagnostics
          path: .build/browser-smoke/
          include-hidden-files: true
          retention-days: 7
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        node: [22, 24]
    env:
      PASEO_COMPILER_PATH: ${{ github.workspace }}/.build/host/package/dist/server/server/plugins/compiler.js
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci --ignore-scripts
      - name: Validate release tag
        if: startsWith(github.ref, 'refs/tags/')
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: npm run version:check
      - run: npm run host:prepare
      - run: npm run check
      - run: npm run host:smoke
      - run: npm run package
      - uses: actions/upload-artifact@v7.0.2
        if: matrix.node == 22
        with:
          name: paseo-notify-ts
          path: |
            dist/*.tgz
            dist/*.sha256
            dist/release.json
          if-no-files-found: error
          retention-days: 14
